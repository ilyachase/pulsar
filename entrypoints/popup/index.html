<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Pulsar</title>
    <meta name="manifest.type" content="browser_action" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <svg id="logo" class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b7bff" />
            <stop offset="1" stop-color="#4f46e5" />
          </linearGradient>
        </defs>
        <circle class="wave" cx="16" cy="16" r="9" />
        <circle cx="16" cy="16" r="15" fill="url(#g)" />
        <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" />
        <circle cx="16" cy="16" r="4" fill="#fff" />
      </svg>
      <div class="title">
        <h1>Pulsar</h1>
        <p id="summary" class="summary"></p>
      </div>
      <span id="updated" class="updated"></span>
      <button id="settings" class="icon-btn" type="button" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="refresh" class="icon-btn" type="button" title="Проверить сейчас" aria-label="Проверить сейчас">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </header>
    <main id="list" class="list"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

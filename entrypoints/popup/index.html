<!doctype html>
<html lang="ru" class="wa-theme-default wa-palette-default wa-brand-indigo">
  <head>
    <meta charset="UTF-8" />
    <title>Pulsar</title>
    <meta name="manifest.type" content="browser_action" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <svg id="logo" class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#808aff" />
            <stop offset="1" stop-color="#4945cb" />
          </linearGradient>
        </defs>
        <circle class="wave" cx="16" cy="16" r="9" />
        <circle cx="16" cy="16" r="15" fill="url(#g)" />
        <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" />
        <circle cx="16" cy="16" r="4" fill="#fff" />
      </svg>
      <div class="title">
        <h1>Pulsar</h1>
        <p id="summary" class="summary"></p>
      </div>
      <wa-button id="settings" appearance="plain" size="s" title="Настройки">
        <wa-icon name="settings" label="Настройки"></wa-icon>
      </wa-button>
      <wa-button id="refresh" appearance="plain" size="s" title="Проверить сейчас">
        <wa-icon name="refresh" label="Проверить сейчас"></wa-icon>
      </wa-button>
    </header>
    <main id="list" class="list"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html class="wa-theme-default wa-palette-default wa-brand-indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="options.title">Pulsar</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#808aff" />
              <stop offset="1" stop-color="#4945cb" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="15" fill="url(#g)" />
          <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" />
          <circle cx="16" cy="16" r="4" fill="#fff" />
        </svg>
        <div>
          <h1 data-i18n="options.heading"></h1>
          <p class="sub" data-i18n="options.tagline"></p>
        </div>
      </header>

      <wa-card>
        <div class="row">
          <span class="name" data-i18n="options.theme"></span>
          <wa-radio-group id="theme" data-i18n-label="options.theme" orientation="horizontal" size="s"></wa-radio-group>
        </div>
        <wa-divider></wa-divider>
        <div class="row">
          <div class="label">
            <label class="name" for="poll" data-i18n="options.poll"></label>
            <span id="poll-hint" class="desc field-hint"></span>
            <span class="desc field-error" aria-live="polite">
              <wa-icon name="circle-alert"></wa-icon><span id="poll-error-text"></span>
            </span>
          </div>
          <wa-number-input id="poll" class="number" required step="1" without-steppers size="s">
            <span slot="end" class="unit" data-i18n="options.pollUnit"></span>
          </wa-number-input>
        </div>
        <wa-divider></wa-divider>
        <div class="row">
          <div class="label">
            <label class="name" for="messages" data-i18n="options.messages"></label>
            <span id="messages-hint" class="desc field-hint"></span>
            <span class="desc field-error" aria-live="polite">
              <wa-icon name="circle-alert"></wa-icon><span id="messages-error-text"></span>
            </span>
          </div>
          <wa-number-input id="messages" class="number" required step="1" without-steppers size="s"></wa-number-input>
        </div>
        <wa-divider></wa-divider>
        <div class="row">
          <label class="name" for="notify" data-i18n="options.notify"></label>
          <wa-switch id="notify"></wa-switch>
        </div>
        <wa-divider></wa-divider>
        <div class="row workmail">
          <div class="label">
            <label class="name" for="workmail-url">Amazon WorkMail</label>
            <span id="workmail-hint" class="desc"></span>
          </div>
          <div class="workmail-controls">
            <wa-input id="workmail-url" type="url" size="s" data-i18n-placeholder="options.workmailPlaceholder"></wa-input>
            <wa-button id="workmail-connect" size="s" variant="brand" data-i18n="options.connect"></wa-button>
            <wa-button id="workmail-disconnect" size="s" appearance="outlined" hidden data-i18n="options.disconnect"></wa-button>
          </div>
        </div>
      </wa-card>

      <!-- Drag to reorder (or Move up/down by keyboard); shown when there are two mailboxes or more -->
      <wa-card id="order-card" hidden>
        <span class="name card-title" data-i18n="options.order"></span>
        <ol id="order-list" class="order"></ol>
      </wa-card>

      <!-- Mailboxes disconnected from the popup; shown only when there are any -->
      <wa-card id="disconnected-card" hidden>
        <span class="name card-title" data-i18n="options.disconnectedTitle"></span>
        <div id="disconnected-list"></div>
      </wa-card>

      <footer class="foot">
        <span id="version"></span>
        <span id="made-by"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ru" class="wa-theme-default wa-palette-default wa-brand-indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulsar — настройки</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#808aff" />
              <stop offset="1" stop-color="#4945cb" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="15" fill="url(#g)" />
          <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" />
          <circle cx="16" cy="16" r="4" fill="#fff" />
        </svg>
        <div>
          <h1>Настройки</h1>
          <p class="sub">Pulsar — пульс вашей почты</p>
        </div>
      </header>

      <wa-card>
        <div class="row">
          <span class="name">Тема</span>
          <wa-radio-group id="theme" label="Тема" orientation="horizontal" size="s"></wa-radio-group>
        </div>
        <wa-divider></wa-divider>
        <div class="row">
          <div class="label">
            <label class="name" for="poll">Проверять почту каждые</label>
            <span id="poll-hint" class="desc" aria-live="polite"></span>
          </div>
          <wa-number-input id="poll" min="30" max="86400" step="1" without-steppers size="s">
            <span slot="end" class="unit">сек</span>
          </wa-number-input>
        </div>
      </wa-card>

      <footer id="version" class="foot"></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulsar — настройки</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b7bff" />
              <stop offset="1" stop-color="#4f46e5" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="15" fill="url(#g)" />
          <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" />
          <circle cx="16" cy="16" r="4" fill="#fff" />
        </svg>
        <div>
          <h1>Настройки</h1>
          <p class="sub">Pulsar — непрочитанные письма Gmail и Яндекс Почты</p>
        </div>
      </header>

      <section class="card">
        <h2>Оформление</h2>
        <div class="row">
          <div class="label">
            <span class="name" id="theme-label">Тема</span>
            <span id="theme-desc" class="desc"></span>
          </div>
          <div id="theme" class="segmented" role="radiogroup" aria-labelledby="theme-label"></div>
        </div>
      </section>

      <section class="card">
        <h2>Проверка почты</h2>
        <div class="row">
          <div class="label">
            <label class="name" for="poll">Как часто проверять</label>
            <span id="poll-hint" class="desc" aria-live="polite"></span>
          </div>
          <div class="field">
            <input id="poll" class="number" type="number" inputmode="numeric" min="30" max="86400" step="1" aria-describedby="poll-hint" />
            <span class="unit">сек</span>
          </div>
        </div>
      </section>

      <footer id="version" class="foot"></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

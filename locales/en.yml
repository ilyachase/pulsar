# The locale these messages are in: Intl formatting and plural rules follow it
locale: en
extName: Pulsar
extDescription: The pulse of your mail

# Plural messages are keyed by Intl.PluralRules categories (see lib/i18n.ts)
# "5 new messages" = count (bold in the popup) + rest; rest carries its own leading space, if any
unread:
  count:
    one: $1 new
    other: $1 new
  rest:
    one: " message"
    other: " messages"

noSubject: (no subject)

popup:
  settings: Settings
  refresh: Check now
  checking: Checking mail…
  noNew: No new mail
  empty: "Sign in to your mail in this browser, and Pulsar will find your mailboxes"
  openInbox: Open inbox
  signIn: Sign in
  retry: Retry
  notSignedIn: Not signed in
  checkFailed: "Couldn't check: $1"
  unknownError: unknown error
  disconnect: "Disconnect"
  disconnectHint: "Pulsar will stop checking this mailbox. You stay signed in to the mail"
  disconnected: "Disconnected: $1"
  undo: "Undo"

badge:
  noNew: no new mail
  empty: "Sign in to your mail in this browser, and Pulsar will find your mailboxes"
  allFailed: couldn't check mail
  allSignedOut: not signed in
  failedIn:
    one: error in $1 mailbox
    other: errors in $1 mailboxes
  signedOutIn:
    one: signed out of $1 mailbox
    other: signed out of $1 mailboxes

options:
  title: Pulsar — Settings
  heading: Settings
  tagline: Pulsar — the pulse of your mail
  theme: Theme
  themeAuto: System
  themeLight: Light
  themeDark: Dark
  poll: Check mail every
  pollUnit: sec
  pollRange: From 30 seconds to a day
  pollRequired: Enter a number of seconds
  pollInteger: Whole seconds only
  pollMin: At least $1 seconds
  pollMax: At most $1 seconds
  notifications: "Notifications"
  notify: Notify about new mail
  sound: Play a sound
  notifyTest: "Test"
  notifyTestMessage: "This is how new mail notifications will look"
  order: "Mailbox order"
  moveUp: "Move up"
  moveDown: "Move down"
  messages: "Messages listed per mailbox"
  messagesRange: "From $1 to $2"
  messagesRequired: "Enter a number of messages"
  messagesInteger: "Whole numbers only"
  workmailPlaceholder: Your WorkMail web address
  connect: Connect
  disconnect: Disconnect
  workmailBadUrl: "Enter a link like https://webmail.mail.<region>.awsapps.com/workmail/"
  workmailDenied: Chrome didn't grant access to the mail address
  disconnectedTitle: "Disconnected mailboxes"

# Author credit and the donation link (settings page footer)
credit:
  madeBy: "Made with ❤️ by $1"
  support: "Support the author"

yandex:
  name: Yandex Mail
  error: "Yandex: $1"
  mailboxNotFound: mailbox not found

mailru:
  name: Mail.ru

workmail:
  noInbox: no Inbox folder
